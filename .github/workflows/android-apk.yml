name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - android-sem-expo
    paths:
      - "artifacts/omega-dx10-native/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: artifacts/omega-dx10-native/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar dependências
        working-directory: artifacts/omega-dx10-native
        run: npm ci

      - name: Permitir execução do Gradle
        working-directory: artifacts/omega-dx10-native/android
        run: chmod +x gradlew

      - name: Gerar APK
        working-directory: artifacts/omega-dx10-native/android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OmegaDX10-Android
          path: artifacts/omega-dx10-native/android/app/build/outputs/apk/debug/app-debug.apk